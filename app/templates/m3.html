{% extends "base.html" %}{% block content %}<div class="quad"><section class="panel"><div class="panel__head"><h2>梯形积分</h2></div>{{table(data.rows,['station','start','end','in_m3','out_m3'])}}</section><section class="panel"><div class="panel__head"><h2>缺口区间</h2><span>{{result.gaps|length}} 段</span></div>{% for gap in result.gaps %}<div class="gap"><span class="tag warn">GAP</span><b>{{gap.station}}</b><time>{{gap.start[:16]}} → {{gap.end[:16]}}</time><strong>{{gap.hours}} h</strong></div>{% endfor %}</section></div>{% endblock %}
