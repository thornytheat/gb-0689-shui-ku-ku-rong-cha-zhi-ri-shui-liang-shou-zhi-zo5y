{% extends "base.html" %}{% block content %}<div class="quad"><section class="panel chart"><div class="panel__head"><h2>水位—库容曲线</h2><span>m / m³</span></div><svg viewBox="0 0 500 250" role="img" aria-label="水位库容曲线"><path class="axis" d="M45 25V210H460"/><path class="guide" d="M45 155H460M45 100H460M45 45H460"/><polyline class="curve" points="{{curve_points}}"/><text x="44" y="232">{{result.curve[0][0]}} m</text><text x="411" y="232">{{result.curve[-1][0]}} m</text><text x="50" y="25">{{result.curve[-1][1]}} m³</text></svg></section><section class="panel chart"><div class="panel__head"><h2>水位轨迹</h2><span>{{result.storage|length}} 测次</span></div><svg viewBox="0 0 500 250" role="img" aria-label="观测水位曲线"><path class="axis" d="M45 25V210H460"/><path class="guide" d="M45 155H460M45 100H460M45 45H460"/><polyline class="level" points="{{level_points}}"/><text x="46" y="232">首测</text><text x="420" y="232">末测</text></svg></section><section class="panel wide"><div class="panel__head"><h2>库容换算证据</h2><span>m³</span></div>{{table(data.rows,['id','time','arrival','level','volume'])}}</section></div>{% endblock %}
