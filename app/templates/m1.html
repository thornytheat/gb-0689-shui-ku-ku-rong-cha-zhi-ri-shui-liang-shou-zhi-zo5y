{% extends "base.html" %}{% block content %}<div class="quad"><section class="panel"><div class="panel__head"><h2>导入水文测次</h2><span>CSV</span></div><form id="water-form"><label>观测文件<textarea name="text" spellcheck="false">{{sample}}</textarea></label><label>上传文件<input name="file" type="file" accept=".csv"></label><div class="parameters"><label>最大缺口 h<input name="max_gap_hours" value="{{defaults.max_gap_hours}}"></label><label>收支容差 m³<input name="tolerance_m3" value="{{defaults.tolerance_m3}}"></label></div><button class="btn primary">重算水账</button></form></section><section class="panel chart"><div class="panel__head"><h2>水位轨迹</h2><span>{{result.storage|length}} 测次</span></div><svg viewBox="0 0 500 250" role="img" aria-label="观测水位曲线"><path class="axis" d="M45 25V210H460"/><path class="guide" d="M45 155H460M45 100H460M45 45H460"/><polyline class="level" points="{{level_points}}"/><text x="46" y="232">首测</text><text x="420" y="232">末测</text></svg></section><section class="panel"><div class="panel__head"><h2>逐行诊断</h2></div>{{table(result.quarantine,['line','key','code','reason'])}}</section><section class="panel"><div class="panel__head"><h2>原始采信</h2></div>{{table(data.rows,['id','time','level','inflow','outflow'])}}</section></div>{% endblock %}
