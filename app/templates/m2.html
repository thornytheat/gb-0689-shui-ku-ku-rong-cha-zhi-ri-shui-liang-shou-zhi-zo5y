{% extends "base.html" %}{% block content %}<div class="quad"><section class="panel chart"><div class="panel__head"><h2>水位—库容曲线</h2><span>m / m³</span></div><svg viewBox="0 0 500 250" role="img" aria-label="水位库容曲线"><path class="axis" d="M45 25V210H460"/><path class="guide" d="M45 155H460M45 100H460M45 45H460"/><polyline class="curve" points="{{curve_points}}"/><text x="44" y="232">{{result.curve[0][0]}} m</text><text x="411" y="232">{{result.curve[-1][0]}} m</text><text x="50" y="25">{{result.curve[-1][1]}} m³</text></svg></section><section class="panel"><div class="panel__head"><h2>曲线校核点</h2></div>{{table(data.rows,['level','volume'])}}<div class="quality-block"><b>严格递增</b><small>{{result.curve|length}} 点 · 范围内插值</small></div></section><section class="panel wide"><div class="panel__head"><h2>测次契约诊断</h2></div>{{table(result.quarantine,['line','code','detail'])}}</section></div>{% endblock %}
